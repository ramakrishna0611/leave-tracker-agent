# Render Blueprint: New > Blueprint > pick this repo. Add GROQ_API_KEY when asked.
services:
  - type: web
    name: away-leave-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn leave_tracker.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: GROQ_API_KEY
        sync: false            # entered in the Render dashboard, never committed
      - key: SECRET_KEY
        generateValue: true    # signs the session cookie
      - key: HTTPS_ONLY
        value: "1"
      - key: CHAT_LIMIT_PER_HOUR
        value: "40"
